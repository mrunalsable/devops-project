---
- name: Update apt cache
  apt:
    update_cache: yes
    cache_valid_time: 3600

- name: Install required packages
  apt:
    name:
      - curl
      - wget
      - git
    state: present

- name: Check if K3s is already installed
  stat:
    path: /usr/local/bin/k3s
  register: k3s_binary

- name: Install K3s
  shell: |
    curl -sfL https://get.k3s.io | sh -s - --tls-san {{ ansible_host }} --write-kubeconfig-mode 644
  when: not k3s_binary.stat.exists
  environment:
    INSTALL_K3S_EXEC: "--write-kubeconfig-mode 644"

- name: Wait for K3s to be ready
  wait_for:
    port: 6443
    delay: 10
    timeout: 120

- name: Start and enable K3s
  systemd:
    name: k3s
    state: started
    enabled: yes

- name: Wait for node to be ready
  shell: k3s kubectl get node | grep -w Ready
  register: node_ready
  retries: 10
  delay: 10
  until: node_ready.rc == 0
  changed_when: false

- name: Create .kube directory for ubuntu user
  file:
    path: /home/ubuntu/.kube
    state: directory
    owner: ubuntu
    group: ubuntu
    mode: '0755'

- name: Copy kubeconfig for ubuntu user
  copy:
    src: /etc/rancher/k3s/k3s.yaml
    dest: /home/ubuntu/.kube/config
    owner: ubuntu
    group: ubuntu
    mode: '0600'
    remote_src: yes

- name: Get K3s node token
  command: cat /var/lib/rancher/k3s/server/node-token
  register: k3s_token
  changed_when: false

- name: Display K3s info
  debug:
    msg:
      - "✅ K3s installed successfully!"
      - "🔑 Node Token: {{ k3s_token.stdout }}"

- name: Verify K3s nodes
  shell: k3s kubectl get nodes -o wide
  register: k3s_nodes
  changed_when: false

- name: Display K3s nodes
  debug:
    msg: "{{ k3s_nodes.stdout_lines }}"
