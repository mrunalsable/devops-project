---
- name: Setup Jenkins + Docker on Jenkins Server
  hosts: jenkins
  become: yes
  gather_facts: yes

  roles:
    - docker
    - jenkins

  post_tasks:
    - name: Verify Docker is running
      systemd:
        name: docker
        state: started
      register: docker_status

    - name: Verify Jenkins is running
      systemd:
        name: jenkins
        state: started
      register: jenkins_status

    - name: Show access info
      debug:
        msg:
          - "✅ Jenkins is ready!"
          - "🌐 Access Jenkins at: http://3.219.242.79:8080"
          - "🔑 Use the password shown above to unlock Jenkins"
